<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Big Day comic page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&amp;family=Comic+Neue:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4EEDF;font-family:'Comic Neue',Georgia,serif;color:#1A1A1A}
a{color:#D8412F}a:hover{color:#A8301F}
</style>
</helmet>
<div style="width: 1200px; height: 1612px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px; background: #F4EEDF; color: #1A1A1A">

<div style="height: 80px; display: flex; justify-content: space-between; align-items: flex-end">
<h1 style="margin: 0; font-family: Bangers, Impact, sans-serif; font-size: 80px; line-height: 0.9; letter-spacing: 3px; color: #1A1A1A">THE BIG DAY</h1>
<div style="font-family: Bangers, Impact, sans-serif; font-size: 28px; letter-spacing: 2px; padding: 6px 14px; background: #1A1A1A; color: #F6C945">ISSUE #1 · PAGE 1</div>
</div>

<!-- Panel 1: establishing shot -->
<div style="width: 1120px; height: 520px; box-sizing: border-box; border: 5px solid #1A1A1A; overflow: hidden; background: {{sky}}">
<svg viewBox="0 0 1120 520" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A small boy walks down a long road toward a giant skyscraper">
<defs>
<pattern id="p1dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1A1A1A" opacity="0.18"></circle></pattern>
<pattern id="p1win" x="620" y="70" width="30" height="34" patternUnits="userSpaceOnUse"><rect x="6" y="6" width="16" height="22" fill="#9FC3DD" stroke="#1A1A1A" stroke-width="2"></rect></pattern>
</defs>
<rect width="1120" height="520" fill="{{sky}}"></rect>
<rect width="1120" height="520" fill="url(#p1dots)"></rect>
<!-- sun -->
<circle cx="200" cy="150" r="70" fill="#FFF6D6" stroke="#1A1A1A" stroke-width="4"></circle>
<!-- far skyline -->
<path d="M0 440 V330 H60 V300 H120 V350 H170 V280 H240 V340 H300 V310 H360 V360 H420 V320 H480 V440 Z" fill="#C9B98F" stroke="#1A1A1A" stroke-width="3"></path>
<path d="M940 440 V320 H990 V280 H1040 V340 H1080 V300 H1120 V440 Z" fill="#C9B98F" stroke="#1A1A1A" stroke-width="3"></path>
<!-- the big building -->
<line x1="740" y1="10" x2="740" y2="-20" stroke="#1A1A1A" stroke-width="5"></line>
<path d="M720 60 L740 18 L760 60 Z" fill="#E7E2D4" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"></path>
<rect x="690" y="58" width="100" height="16" fill="#E7E2D4" stroke="#1A1A1A" stroke-width="4"></rect>
<path d="M860 70 L900 90 L900 440 L860 440 Z" fill="#6E8FA8" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"></path>
<rect x="620" y="70" width="240" height="370" fill="#E7E2D4" stroke="#1A1A1A" stroke-width="5"></rect>
<rect x="620" y="70" width="240" height="300" fill="url(#p1win)"></rect>
<rect x="690" y="380" width="100" height="60" fill="#FFF6D6" stroke="#1A1A1A" stroke-width="4"></rect>
<line x1="740" y1="380" x2="740" y2="440" stroke="#1A1A1A" stroke-width="3"></line>
<!-- ground and road -->
<rect x="0" y="440" width="1120" height="80" fill="#D9CFB8" stroke="#1A1A1A" stroke-width="4"></rect>
<path d="M690 440 L790 440 L1000 520 L420 520 Z" fill="#8C8577" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"></path>
<path d="M738 446 L736 458 M731 470 L727 488 M718 500 L712 520" stroke="#F4EEDF" stroke-width="5" stroke-linecap="round"></path>
<!-- the boy, small, walking right -->
<g transform="translate(520 500) scale(0.42)" stroke-linecap="round" stroke-linejoin="round">
<path d="M-4 -90 L-20 -66 L-14 -50" fill="none" stroke="#1A1A1A" stroke-width="16"></path>
<path d="M-4 -90 L-20 -66 L-14 -50" fill="none" stroke="{{hoodie}}" stroke-width="9"></path>
<path d="M0 -54 L-10 -28 L-22 -8" fill="none" stroke="#1A1A1A" stroke-width="18"></path>
<path d="M0 -54 L-10 -28 L-22 -8" fill="none" stroke="#2E5E8C" stroke-width="11"></path>
<path d="M4 -54 L16 -28 L20 -6" fill="none" stroke="#1A1A1A" stroke-width="18"></path>
<path d="M4 -54 L16 -28 L20 -6" fill="none" stroke="#2E5E8C" stroke-width="11"></path>
<path d="M-34 -12 H-16 Q-8 -12 -6 -4 V0 H-34 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"></path>
<path d="M12 -12 H30 Q38 -12 40 -4 V0 H12 Z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"></path>
<rect x="-32" y="-98" width="20" height="40" rx="6" fill="#F6C945" stroke="#1A1A1A" stroke-width="4"></rect>
<rect x="-14" y="-102" width="32" height="52" rx="9" fill="{{hoodie}}" stroke="#1A1A1A" stroke-width="4"></rect>
<path d="M8 -90 L22 -68 L30 -54" fill="none" stroke="#1A1A1A" stroke-width="16"></path>
<path d="M8 -90 L22 -68 L30 -54" fill="none" stroke="{{hoodie}}" stroke-width="9"></path>
<circle cx="4" cy="-120" r="19" fill="#F2C09A" stroke="#1A1A1A" stroke-width="4"></circle>
<path d="M-15 -122 Q-18 -142 2 -140 L6 -150 L12 -140 L22 -143 L21 -128 Q10 -134 -15 -122 Z" fill="#1A1A1A"></path>
<circle cx="15" cy="-119" r="2.5" fill="#1A1A1A"></circle>
</g>
<!-- caption -->
<rect x="24" y="24" width="360" height="60" fill="#F6C945" stroke="#1A1A1A" stroke-width="4"></rect>
<text x="44" y="63" font-family="'Comic Neue', sans-serif" font-weight="700" font-size="24" fill="#1A1A1A">MONDAY. 8:52 AM. DAY ONE.</text>
</svg>
</div>

<!-- Row 2 -->
<div style="display: flex; gap: 24px">

<!-- Panel 2: sneakers close-up -->
<div style="width: 548px; height: 420px; box-sizing: border-box; border: 5px solid #1A1A1A; overflow: hidden; background: #2E5E8C">
<svg viewBox="0 0 548 420" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Close-up of sneakers stepping forward">
<defs>
<pattern id="p2dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2.2" fill="#FFFFFF" opacity="0.14"></circle></pattern>
</defs>
<rect width="548" height="420" fill="#2E5E8C"></rect>
<rect width="548" height="420" fill="url(#p2dots)"></rect>
<!-- speed lines -->
<g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7">
<line x1="10" y1="190" x2="90" y2="190"></line>
<line x1="30" y1="226" x2="120" y2="226"></line>
<line x1="0" y1="262" x2="70" y2="262"></line>
</g>
<rect x="0" y="350" width="548" height="70" fill="#8C8577" stroke="#1A1A1A" stroke-width="5"></rect>
<!-- back foot, lifted -->
<g transform="rotate(-16 220 300) translate(-120 -40)">
<rect x="212" y="-20" width="84" height="272" fill="#1F4568" stroke="#1A1A1A" stroke-width="5"></rect>
<path d="M200 330 L200 282 Q200 250 240 250 L300 250 Q322 282 380 292 Q420 300 420 322 L420 330 Z" fill="{{hoodie}}" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"></path>
<rect x="196" y="318" width="228" height="20" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"></rect>
</g>
<!-- front foot, planted -->
<g transform="translate(40 14)">
<rect x="212" y="-20" width="84" height="272" fill="#2E5E8C" stroke="#1A1A1A" stroke-width="5"></rect>
<path d="M210 -20 V252" stroke="#1F4568" stroke-width="3"></path>
<path d="M200 330 L200 282 Q200 250 240 250 L300 250 Q322 282 380 292 Q420 300 420 322 L420 330 Z" fill="{{hoodie}}" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"></path>
<path d="M300 262 L318 256 M310 274 L330 266 M322 284 L342 276" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path>
<rect x="196" y="318" width="228" height="20" rx="6" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="5"></rect>
</g>
<!-- SFX -->
<g font-family="Bangers, Impact, sans-serif" stroke="#1A1A1A" stroke-width="3" paint-order="stroke" stroke-linejoin="round">
<text x="300" y="92" font-size="64" fill="#F6C945" transform="rotate(-8 300 92)">TAP</text>
<text x="400" y="150" font-size="52" fill="#F6C945" transform="rotate(6 400 150)">TAP</text>
<text x="330" y="210" font-size="40" fill="#F6C945" transform="rotate(-4 330 210)">TAP</text>
</g>
</svg>
</div>

<!-- Panel 3: looking up -->
<div style="width: 548px; height: 420px; box-sizing: border-box; border: 5px solid #1A1A1A; overflow: hidden; background: #D8412F">
<svg viewBox="0 0 548 420" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The boy looks straight up at the towering building">
<rect width="548" height="420" fill="#D8412F"></rect>
<!-- burst rays -->
<g fill="#F6C945">
<path d="M274 -40 L0 40 L0 110 Z"></path>
<path d="M274 -40 L0 200 L0 280 Z"></path>
<path d="M274 -40 L60 420 L140 420 Z"></path>
<path d="M274 -40 L548 40 L548 110 Z"></path>
<path d="M274 -40 L548 200 L548 280 Z"></path>
<path d="M274 -40 L488 420 L408 420 Z"></path>
</g>
<!-- building in steep perspective -->
<path d="M110 420 L236 -10 L312 -10 L438 420 Z" fill="#E7E2D4" stroke="#1A1A1A" stroke-width="6" stroke-linejoin="round"></path>
<path d="M312 -10 L438 420 L470 420 L330 -10 Z" fill="#6E8FA8" stroke="#1A1A1A" stroke-width="5" stroke-linejoin="round"></path>
<g stroke="#1A1A1A" stroke-width="3">
<line x1="219" y1="50" x2="329" y2="50"></line>
<line x1="198" y1="120" x2="350" y2="120"></line>
<line x1="171" y1="210" x2="377" y2="210"></line>
<line x1="136" y1="330" x2="412" y2="330"></line>
<line x1="274" y1="-10" x2="274" y2="420"></line>
<line x1="255" y1="-10" x2="192" y2="420"></line>
<line x1="293" y1="-10" x2="356" y2="420"></line>
</g>
<g fill="#9FC3DD" stroke="#1A1A1A" stroke-width="2">
<path d="M204 130 L228 130 L226 200 L196 200 Z"></path>
<path d="M320 130 L344 130 L352 200 L322 200 Z"></path>
<path d="M180 222 L220 222 L216 320 L166 320 Z"></path>
<path d="M328 222 L368 222 L382 320 L332 320 Z"></path>
</g>
<!-- boy's head from behind, tilted back -->
<ellipse cx="274" cy="460" rx="120" ry="110" fill="#1A1A1A"></ellipse>
<ellipse cx="158" cy="430" rx="18" ry="26" fill="#F2C09A" stroke="#1A1A1A" stroke-width="5"></ellipse>
<ellipse cx="390" cy="430" rx="18" ry="26" fill="#F2C09A" stroke="#1A1A1A" stroke-width="5"></ellipse>
<path d="M180 370 L196 336 L214 364 L236 328 L256 360 L276 324 L296 360 L318 330 L334 364 L354 338 L368 372 Z" fill="#1A1A1A"></path>
<!-- speech bubble -->
<ellipse cx="130" cy="78" rx="112" ry="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"></ellipse>
<path d="M150 126 L196 170 L118 128" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round"></path>
<path d="M124 126 L152 124" stroke="#FFFFFF" stroke-width="6"></path>
<text x="130" y="72" text-anchor="middle" font-family="'Comic Neue', sans-serif" font-weight="700" font-size="24" fill="#1A1A1A">Whoa…</text>
<text x="130" y="100" text-anchor="middle" font-family="'Comic Neue', sans-serif" font-weight="700" font-size="20" fill="#1A1A1A">it's HUGE.</text>
</svg>
</div>
</div>

<!-- Panel 4: at the doors -->
<div style="width: 1120px; height: 440px; box-sizing: border-box; border: 5px solid #1A1A1A; overflow: hidden; background: #E7E2D4">
<svg viewBox="0 0 1120 440" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The boy stands before the building's giant glass doors">
<defs>
<pattern id="p4dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#1A1A1A" opacity="0.14"></circle></pattern>
</defs>
<rect width="1120" height="440" fill="#E7E2D4"></rect>
<rect width="1120" height="440" fill="url(#p4dots)"></rect>
<!-- facade columns -->
<rect x="200" y="0" width="60" height="380" fill="#D2CBB8" stroke="#1A1A1A" stroke-width="5"></rect>
<rect x="860" y="0" width="60" height="380" fill="#D2CBB8" stroke="#1A1A1A" stroke-width="5"></rect>
<rect x="260" y="20" width="600" height="46" fill="#1A1A1A"></rect>
<text x="560" y="54" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="34" letter-spacing="10" fill="#F6C945">[COMPANY NAME]</text>
<!-- giant doors, lit from inside -->
<rect x="300" y="86" width="520" height="294" fill="#FFF6D6" stroke="#1A1A1A" stroke-width="6"></rect>
<line x1="560" y1="86" x2="560" y2="380" stroke="#1A1A1A" stroke-width="6"></line>
<line x1="430" y1="86" x2="430" y2="380" stroke="#1A1A1A" stroke-width="3"></line>
<line x1="690" y1="86" x2="690" y2="380" stroke="#1A1A1A" stroke-width="3"></line>
<rect x="536" y="210" width="10" height="70" rx="4" fill="#1A1A1A"></rect>
<rect x="574" y="210" width="10" height="70" rx="4" fill="#1A1A1A"></rect>
<g stroke="#F6C945" stroke-width="5" stroke-linecap="round">
<line x1="360" y1="120" x2="400" y2="160"></line>
<line x1="760" y1="120" x2="720" y2="160"></line>
</g>
<!-- floor -->
<rect x="0" y="380" width="1120" height="60" fill="#8C8577" stroke="#1A1A1A" stroke-width="5"></rect>
<path d="M300 380 L200 440 M820 380 L920 440" stroke="#1A1A1A" stroke-width="3"></path>
<!-- the boy, from behind -->
<g transform="translate(560 404) scale(1.25)" stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round">
<rect x="-18" y="-64" width="15" height="58" rx="4" fill="#2E5E8C"></rect>
<rect x="3" y="-64" width="15" height="58" rx="4" fill="#2E5E8C"></rect>
<ellipse cx="-11" cy="-4" rx="13" ry="6" fill="#FFFFFF"></ellipse>
<ellipse cx="11" cy="-4" rx="13" ry="6" fill="#FFFFFF"></ellipse>
<rect x="-38" y="-122" width="13" height="54" rx="6" fill="{{hoodie}}"></rect>
<rect x="25" y="-122" width="13" height="54" rx="6" fill="{{hoodie}}"></rect>
<rect x="-26" y="-126" width="52" height="68" rx="10" fill="{{hoodie}}"></rect>
<rect x="-20" y="-118" width="40" height="50" rx="8" fill="#F6C945"></rect>
<line x1="-12" y1="-102" x2="12" y2="-102"></line>
<circle cx="-22" cy="-146" r="6" fill="#F2C09A"></circle>
<circle cx="22" cy="-146" r="6" fill="#F2C09A"></circle>
<circle cx="0" cy="-148" r="21" fill="#1A1A1A"></circle>
<path d="M-16 -162 L-10 -176 L-2 -166 L6 -178 L12 -164 L20 -170 L18 -156 Z" fill="#1A1A1A"></path>
</g>
<!-- thought bubble -->
<circle cx="660" cy="250" r="7" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"></circle>
<circle cx="690" cy="222" r="11" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="3"></circle>
<ellipse cx="850" cy="170" rx="150" ry="56" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"></ellipse>
<text x="850" y="180" text-anchor="middle" font-family="'Comic Neue', sans-serif" font-weight="700" font-size="28" fill="#1A1A1A">Here goes nothing.</text>
<!-- caption -->
<rect x="24" y="24" width="150" height="50" fill="#F6C945" stroke="#1A1A1A" stroke-width="4"></rect>
<text x="42" y="57" font-family="'Comic Neue', sans-serif" font-weight="700" font-size="22" fill="#1A1A1A">8:59 AM.</text>
<text x="1090" y="424" text-anchor="end" font-family="Bangers, Impact, sans-serif" font-size="26" letter-spacing="2" fill="#F4EEDF">TO BE CONTINUED…</text>
</svg>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"hoodie":{"editor":"color","default":"#D8412F","options":["#D8412F","#2F8F5B","#7A4FB5","#E08A1E"]},"sky":{"editor":"color","default":"#F6C945","options":["#F6C945","#9FC3DD","#F2A07B"]},"$preview":{"width":1200,"height":1612}}'>
class Component extends DCLogic {
renderVals() {
return { hoodie: this.props.hoodie ?? '#D8412F', sky: this.props.sky ?? '#F6C945' };
}
}
</script>
</body>
</html>
